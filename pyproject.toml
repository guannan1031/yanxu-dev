[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yanxu-dev"
version = "0.4.0"
description = "Version-bound GitHub PR and CI evidence with task contracts and isolated test replay"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
yanxu = "yanxu.cli:main"

[tool.setuptools.packages.find]
include = ["yanxu*"]
