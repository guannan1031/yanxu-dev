[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yanxu-dev"
version = "0.10.0"
description = "Evidence-bound AI coding workflow with controlled generation, isolated tests and Draft PR delivery"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
yanxu = "yanxu.cli:main"

[tool.setuptools.packages.find]
include = ["yanxu*"]
