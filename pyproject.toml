[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yanxu-dev"
version = "0.16.0"
description = "Evidence-bound AI coding workflow with controlled generation, isolated tests and Draft PR delivery"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
server = [
  "fastapi>=0.116,<1",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.35,<1",
]

[project.scripts]
yanxu = "yanxu.cli:main"

[tool.setuptools.packages.find]
include = ["yanxu*"]
