[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yanxu-dev"
version = "0.6.0"
description = "Evidence-bound AI delivery workflow with task contracts, isolated tests and paired benchmarks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
yanxu = "yanxu.cli:main"

[tool.setuptools.packages.find]
include = ["yanxu*"]
