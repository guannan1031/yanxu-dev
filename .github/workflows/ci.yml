name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Independent contract and regression tests
        run: python -m unittest discover -s tests -v
      - name: Windows handoff self-check
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\windows-check.ps1 -SkipTests

  private-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yanxu_test
          POSTGRES_USER: yanxu
          POSTGRES_PASSWORD: yanxu_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yanxu -d yanxu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      YANXU_TEST_DATABASE_URL: postgresql://yanxu:yanxu_test_password@127.0.0.1:5432/yanxu_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install private service
        run: python -m pip install '.[server]' httpx
      - name: PostgreSQL organization, API and webhook integration tests
        run: python -m unittest discover -s tests -v
