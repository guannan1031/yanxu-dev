services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yanxu
      POSTGRES_USER: yanxu
      POSTGRES_PASSWORD: ${YANXU_DB_PASSWORD:?set YANXU_DB_PASSWORD}
    volumes:
      - yanxu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yanxu -d yanxu"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    environment:
      YANXU_DATABASE_URL: postgresql://yanxu:${YANXU_DB_PASSWORD}@db:5432/yanxu
      YANXU_BOOTSTRAP_ORG_SLUG: ${YANXU_BOOTSTRAP_ORG_SLUG:?set YANXU_BOOTSTRAP_ORG_SLUG}
      YANXU_BOOTSTRAP_ORG_NAME: ${YANXU_BOOTSTRAP_ORG_NAME:?set YANXU_BOOTSTRAP_ORG_NAME}
      YANXU_BOOTSTRAP_TOKEN: ${YANXU_BOOTSTRAP_TOKEN:?set YANXU_BOOTSTRAP_TOKEN}
      YANXU_GITHUB_WEBHOOK_SECRET: ${YANXU_GITHUB_WEBHOOK_SECRET:?set YANXU_GITHUB_WEBHOOK_SECRET}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${YANXU_PORT:-8080}:8080"
    restart: unless-stopped
  worker:
    build: .
    command: ["yanxu", "worker", "--interval", "2"]
    environment:
      YANXU_DATABASE_URL: postgresql://yanxu:${YANXU_DB_PASSWORD}@db:5432/yanxu
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  yanxu-postgres:
